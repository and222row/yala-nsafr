name: yala_nsafr
description: Intercity carpooling app for Egypt

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.1.4

  # HTTP
  dio: ^5.4.3+1

  # Secure local storage (JWT token)
  flutter_secure_storage: ^9.2.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  pinput: ^5.0.0          # OTP input field
  intl_phone_field: ^3.2.0 # Phone input with country code
  gap: ^3.0.1              # Spacing
  badges: ^3.1.2           # Notification badges

  # Forms & validation
  reactive_forms: ^17.0.1

  # Firebase / push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  flutter_local_notifications: ^17.2.2

  # Connectivity
  connectivity_plus: ^6.0.0

  # Utilities
  intl: ^0.20.3
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  uuid: ^4.4.0
  # Maps & location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.0

  # Payments
  flutter_stripe: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true  # enables l10n generation

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
